services:
  postgres:
    image: postgres:17-alpine
    container_name: chronosq-postgres

    environment:
      POSTGRES_DB: chronosq
      POSTGRES_USER: chronosq
      POSTGRES_PASSWORD: chronosq

    ports:
      - "5433:5432"

    volumes:
      - chronosq-postgres-data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chronosq -d chronosq"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  chronosq-postgres-data: