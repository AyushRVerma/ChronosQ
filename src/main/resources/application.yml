spring:
  application:
    name: chronosq

  datasource:
    url: jdbc:postgresql://localhost:5433/chronosq
    username: chronosq
    password: chronosq

    hikari:
      maximum-pool-size: ${CHRONOSQ_DB_POOL_SIZE:10}

  flyway:
    enabled: true
    locations: classpath:db/migration

  jackson:
    time-zone: UTC

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus

  endpoint:
    health:
      show-details: always
      probes:
        enabled: true

chronosq:
  scheduler:
    enabled: ${CHRONOSQ_SCHEDULER_ENABLED:true}
    poll-interval-ms: ${CHRONOSQ_SCHEDULER_POLL_INTERVAL_MS:1000}
    batch-size: ${CHRONOSQ_SCHEDULER_BATCH_SIZE:100}

  worker:
    enabled: ${CHRONOSQ_WORKER_ENABLED:false}
    worker-id: ${CHRONOSQ_WORKER_ID:${random.uuid}}
    instance-name: ${CHRONOSQ_INSTANCE_NAME:local-chronosq}
    queue-name: ${CHRONOSQ_WORKER_QUEUE:default}
    claim-batch-size: ${CHRONOSQ_WORKER_CLAIM_BATCH_SIZE:10}
    lease-duration-seconds: ${CHRONOSQ_WORKER_LEASE_DURATION_SECONDS:60}

  execution:
    poll-interval-ms: ${CHRONOSQ_EXECUTION_POLL_INTERVAL_MS:1000}
    thread-count: ${CHRONOSQ_EXECUTION_THREAD_COUNT:4}
    queue-capacity: ${CHRONOSQ_EXECUTION_QUEUE_CAPACITY:100}

  webhook:
    connect-timeout-ms: ${CHRONOSQ_WEBHOOK_CONNECT_TIMEOUT_MS:5000}
    read-timeout-ms: ${CHRONOSQ_WEBHOOK_READ_TIMEOUT_MS:30000}

  retry:
    enabled: ${CHRONOSQ_RETRY_ENABLED:true}
    initial-delay-ms: ${CHRONOSQ_RETRY_INITIAL_DELAY_MS:1000}
    maximum-delay-ms: ${CHRONOSQ_RETRY_MAXIMUM_DELAY_MS:300000}
    multiplier: ${CHRONOSQ_RETRY_MULTIPLIER:2.0}
    jitter-factor: ${CHRONOSQ_RETRY_JITTER_FACTOR:0.2}

  recovery:
    enabled: ${CHRONOSQ_RECOVERY_ENABLED:true}
    poll-interval-ms: ${CHRONOSQ_RECOVERY_POLL_INTERVAL_MS:10000}
    batch-size: ${CHRONOSQ_RECOVERY_BATCH_SIZE:100}

  heartbeat:
    enabled: ${CHRONOSQ_HEARTBEAT_ENABLED:true}
    interval-ms: ${CHRONOSQ_HEARTBEAT_INTERVAL_MS:5000}

  management:
    endpoints:
      web:
        exposure:
          include: health,info,prometheus

