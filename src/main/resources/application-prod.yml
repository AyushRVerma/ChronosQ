spring:
  config:
    activate:
      on-profile: prod

  datasource:
    url: ${CHRONOSQ_DB_URL}
    username: ${CHRONOSQ_DB_USERNAME}
    password: ${CHRONOSQ_DB_PASSWORD}

    hikari:
      maximum-pool-size: ${CHRONOSQ_DB_POOL_SIZE:20}
      minimum-idle: ${CHRONOSQ_DB_MIN_IDLE:5}
      connection-timeout: ${CHRONOSQ_DB_CONNECTION_TIMEOUT_MS:30000}
      validation-timeout: ${CHRONOSQ_DB_VALIDATION_TIMEOUT_MS:5000}
      idle-timeout: ${CHRONOSQ_DB_IDLE_TIMEOUT_MS:600000}
      max-lifetime: ${CHRONOSQ_DB_MAX_LIFETIME_MS:1800000}

  flyway:
    enabled: true
    locations: classpath:db/migration
    validate-on-migrate: true

  lifecycle:
    timeout-per-shutdown-phase: ${CHRONOSQ_SHUTDOWN_TIMEOUT:30s}

  jackson:
    time-zone: UTC

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful
  forward-headers-strategy: framework

  compression:
    enabled: true
    min-response-size: 1KB

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus

  endpoint:
    health:
      show-details: when-authorized
      probes:
        enabled: true

logging:
  level:
    root: INFO
    com.chronosq: INFO
    org.springframework.jdbc.core: WARN