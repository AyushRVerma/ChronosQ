services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped

    environment:
      POSTGRES_DB: ${POSTGRES_DB:-chronosq}
      POSTGRES_USER: ${POSTGRES_USER:-chronosq}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be provided}

    volumes:
      - chronosq-postgres-data:/var/lib/postgresql/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-chronosq} -d ${POSTGRES_DB:-chronosq}"
        ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

    networks:
      - chronosq-network

  chronosq:
    image: chronosq:1.0.0
    build:
      context: .
      dockerfile: Dockerfile

    restart: unless-stopped

    depends_on:
      postgres:
        condition: service_healthy

    environment:
      CHRONOSQ_OAUTH_CLIENT_ID: ${CHRONOSQ_OAUTH_CLIENT_ID:-postman-client}
      CHRONOSQ_OAUTH_CLIENT_SECRET: ${CHRONOSQ_OAUTH_CLIENT_SECRET:?CHRONOSQ_OAUTH_CLIENT_SECRET must be provided}
      CHRONOSQ_DASHBOARD_CLIENT_ID: ${CHRONOSQ_DASHBOARD_CLIENT_ID:-dashboard-client}
      CHRONOSQ_DASHBOARD_CLIENT_SECRET: ${CHRONOSQ_DASHBOARD_CLIENT_SECRET:?CHRONOSQ_DASHBOARD_CLIENT_SECRET must be provided}

      CHRONOSQ_JWT_KEYSTORE_LOCATION: file:/run/secrets/chronosq-jwt.p12
      CHRONOSQ_JWT_KEYSTORE_PASSWORD: ${CHRONOSQ_JWT_KEYSTORE_PASSWORD:?CHRONOSQ_JWT_KEYSTORE_PASSWORD must be provided}
      CHRONOSQ_JWT_KEY_ALIAS: ${CHRONOSQ_JWT_KEY_ALIAS:-chronosq-jwt}
      CHRONOSQ_JWT_ISSUER: ${CHRONOSQ_JWT_ISSUER:-http://localhost:8080}
      CHRONOSQ_JWT_AUDIENCE: ${CHRONOSQ_JWT_AUDIENCE:-chronosq-api}
      SPRING_PROFILES_ACTIVE: prod

      CHRONOSQ_DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-chronosq}
      CHRONOSQ_DB_USERNAME: ${POSTGRES_USER:-chronosq}
      CHRONOSQ_DB_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be provided}
      CHRONOSQ_DB_POOL_SIZE: ${CHRONOSQ_DB_POOL_SIZE:-20}

      SERVER_PORT: 8080

    ports:
      - "${CHRONOSQ_HTTP_PORT:-8080}:8080"

    volumes:
      - ./secrets/chronosq-jwt.p12:/run/secrets/chronosq-jwt.p12:ro

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -q -O - http://localhost:8080/actuator/health/readiness || exit 1"
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s

    networks:
      - chronosq-network

volumes:
  chronosq-postgres-data:

networks:
  chronosq-network:
    driver: bridge
